name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · layer guard · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # MS2 exit criterion: the four-layer boundary is enforced, not aspirational.
      - run: npm run check:layers
      # Every table created in public must revoke from both browser roles: the hosted projects grant
      # ALL on new tables to anon and authenticated by default and the migration role cannot stop
      # them, so a local `db reset` proves nothing here. See docs/ms4-database.md §2.3.
      - run: npm run check:migrations
      # These three ran only in local `npm run verify` until 2026-08-30, which meant the job named
      # "lint · typecheck · layer guard · unit" was a strict subset of the local filter it was
      # supposed to backstop. A guard that runs only on the machine that wrote the change is not a
      # gate. check:schema is the one whose absence already cost us: docs/git-workflow.md §9.2
      # records two real defects that hid behind a green local verify.
      - run: npm run check:schema
      - run: npm run check:agents
      # Proves main is still protected and the committed permission posture still encodes
      # git-workflow.md §9.3 — see docs/claude-code-setup.md.
      - run: npm run check:claude
      - run: npm run test

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and their ~40 system libraries.
    # `playwright install --with-deps` on a bare runner is dominated by apt-get and
    # its latency is wildly unstable — measured 2026-08-18 across four runs of this
    # repo: 24s, 203s, and one still going at 6min+. The image pull replaces it at a
    # steady 35-38s, so this is a smaller median and a far tighter spread.
    # `--user 1001` is Playwright's documented CI pattern — Chromium's sandbox
    # refuses to run as root.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The image tag above and the installed package must not drift apart:
      # a silently mismatched browser build is exactly the flake nobody can reproduce.
      - name: container image matches @playwright/test
        run: |
          image=1.62.1
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$image" != "$installed" ]; then
            echo "::error::container image is v$image but @playwright/test is $installed — bump the image tag in this workflow" >&2
            exit 1
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: migrations · RLS policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole schema is rebuilt from zero on every run: that reproducibility IS the acceptance
      # test for the migration set (08 §9). Only the services the policy tests need are started —
      # the db and auth (auth.users is the fixtures' root). Studio, realtime, storage and the edge
      # runtime would add minutes and prove nothing here.
      - name: start local supabase (db + auth only)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # --no-seed: this job's acceptance test is the migrated schema itself (08 §9) plus the
      # policy tests below, which assert exact row counts (P7's near-duplicate guard expects
      # to be the only place in the table) — supabase/seed.sql's fixtures are local-dev-only
      # convenience data and must not be present here. `npm run db:reset` (no flag) is what
      # local dev runs, and does seed, per config.toml's [db.seed].
      - name: rebuild the schema from migration 0001
        run: npm run db:reset -- --no-seed
      # MS4's exit gate: user B's select of user A's saved_places returns zero rows, and a place is
      # invisible to a user who has not saved it. A policy regression fails the build, not the exam.
      - name: RLS policy tests (acceptance P3)
        run: npm run db:test
      # The same read-only inventory that gets pointed at staging and production. Running it here
      # too means its expected grant/policy matrix cannot drift away from the migrations unnoticed —
      # otherwise the check that guards production is itself unguarded.
      - name: schema inventory (read-only)
        run: npm run db:inventory
