name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · layer guard · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # MS2 exit criterion: the four-layer boundary is enforced, not aspirational.
      - run: npm run check:layers
      # Every table created in public must revoke from both browser roles: the hosted projects grant
      # ALL on new tables to anon and authenticated by default and the migration role cannot stop
      # them, so a local `db reset` proves nothing here. See docs/ms4-database.md §2.3.
      - run: npm run check:migrations
      # These three ran only in local `npm run verify` until 2026-08-30, which meant the job named
      # "lint · typecheck · layer guard · unit" was a strict subset of the local filter it was
      # supposed to backstop. A guard that runs only on the machine that wrote the change is not a
      # gate. check:schema is the one whose absence already cost us: docs/git-workflow.md §9.2
      # records two real defects that hid behind a green local verify.
      - run: npm run check:schema
      - run: npm run check:agents
      # Proves main is still protected and the committed permission posture still encodes
      # git-workflow.md §9.3 — see docs/claude-code-setup.md.
      - run: npm run check:claude
      - run: npm run test

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # PRs only. This job and `database` used to run on `push: [main]` as well, so every merge paid
    # ~25 minutes re-proving what the pull request had proved minutes earlier — against a 2,000
    # minute monthly allowance that a run of ~20 minutes exhausts in about a hundred runs. The
    # merge commit is the PR head plus main, and `scripts/merge-pr.sh` already refuses a branch
    # that does not contain current main, so the combination was tested before the button.
    if: github.event_name == 'pull_request'
    # ## Why this job no longer runs inside mcr.microsoft.com/playwright
    #
    # It used to, and the reason was measured: `playwright install --with-deps` on a bare runner is
    # dominated by apt-get and its latency is wildly unstable — measured 2026-08-18 across four runs
    # of this repo: 24s, 203s, and one still going at 6min+. The image pull replaced it at a steady
    # 35-38s: a smaller median and a far tighter spread. Those numbers still stand; nothing below
    # disproves them.
    #
    # What changed is the requirement. From 2026-09-01 this job has to stand up a local Supabase,
    # because `tests/e2e/global-setup.ts` is now wired into playwright.config.ts and refuses to let
    # the signed-in tier skip silently in CI — before that, 28 of 34 tests skipped on every run and
    # the check still reported green. `npx supabase start` needs a Docker daemon, and a container
    # job has none: the runner's socket is not mounted, the job container is not on the host's
    # loopback, and the workspace is bind-mounted at a different path inside the container than the
    # one the CLI would hand to Docker. Docker-in-Docker or a hand-rolled postgres+gotrue+postgrest
    # `services:` stack would both replace supabase/config.toml with a second, silently diverging
    # definition of the same stack.
    #
    # So the trade taken is deliberate: pay the unstable apt cost back, and buy down as much of it
    # as is cacheable. Only Chromium is installed — all four Playwright projects are Chromium — and
    # ~/.cache/ms-playwright is cached on the resolved @playwright/test version, so the browser
    # download is paid once per version bump. The apt half is not cacheable and remains the variance
    # this comment used to be about. `--user 1001` is gone with the container: a runner job already
    # runs as a non-root user, which is all Chromium's sandbox asked for.
    #
    # The version-drift guard that lived here is gone too, and deliberately not replaced by another
    # check: it existed because a hard-coded image tag could drift from the installed package. There
    # is no tag any more — `npx playwright install` resolves the browser build from the installed
    # package itself, so the two cannot disagree. The one way drift could come back is a stale cache,
    # which is why the cache key below carries the resolved version and nothing else does.
    env:
      # supabase/seed.sql's demo user, in clear on purpose. It authenticates a database that exists
      # for the length of this job inside this runner and is reachable from nowhere else; putting it
      # in a repo secret would imply it guards something. tests/e2e/global-setup.ts fails the job if
      # it is missing, which is the whole point of that file.
      E2E_PASSWORD: local-dev-preview-1234
      # A provider and a placeholder key, and the key is never spent.
      #
      # `probe/route.ts` builds the extractor *before* it reads the extraction cache, because the
      # cache key is the extractor's own `version` and `promptVersion` — so `createPlaceExtractor`
      # throws `ANTHROPIC_API_KEY is required` on a path that provably needs no credential, and the
      # import spec died there rather than at anything it was testing. `supabase/seed.sql` seeds a
      # cached extraction for that video under both extractor versions, with its `resolution`
      # sibling, so the run hits the cache and skips the model and the places lookup alike.
      #
      # `anthropic` because it is the factory's default and therefore what an unset environment
      # selects anyway; naming it makes the pairing with the seeded row explicit rather than
      # incidental. If the cache ever misses — a moved `PROMPT_VERSION` is the likely reason — CI
      # fails loudly with an auth error and still spends nothing, which is the failure we want.
      #
      # The real fix is to construct the extractor after the cache read, or to take the version
      # constants without a key. That is a change to the import route and it is not worth making
      # two days before a submission deadline; this is the seam that costs nothing.
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: not-a-real-key-the-cache-is-hit-before-any-call
      # Read by src/domain/build-info.ts, and by the place-resolver factory: 'test' is one of its
      # non-production stages, so with no Google key configured here the factory selects the Overture
      # resolver for the honest reason ("no Google Places API key configured") rather than by
      # mistaking an unset stage for production. CI must never spend a billable place lookup.
      NEXT_PUBLIC_STAGE: test
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: resolve the installed Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache the browser build for that version
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Runs on a cache hit too: the download is what the cache saves, and the system libraries are
      # apt state that no cache restores. On a hit the install itself is a no-op.
      - run: npx playwright install --with-deps chromium

      # ---- the database the signed-in tier needs -------------------------------------------------
      # Same invocation as the `database` job below, and for the same reason: only the services the
      # app actually talks to. Nothing in src/ calls .storage or .channel, so storage-api, imgproxy
      # and realtime would add minutes and serve no request this suite makes.
      - name: start local supabase (db + auth + rest)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # WITH the seed, unlike the `database` job's --no-seed. supabase/seed.sql is exactly what this
      # job needs and that one must not have: the demo user E2E_PASSWORD belongs to, plus the saved
      # places the map, library-search and collections specs read.
      - name: apply every migration and seed the demo user
        run: npm run db:reset
      # The keys are generated per stack, so they are read back rather than hard-coded. --override-name
      # is the CLI's own documented mechanism (`supabase status --help`); the three names on the left
      # are what `status -o env` emits, verified against the installed CLI 2.115.0.
      - name: export the local Supabase credentials into the job env
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' >> "$GITHUB_ENV"
      # A blank value here is the exact failure this job was written to end: the dev server would boot
      # into "Your project's URL and Key are required to create a Supabase client!" and Playwright
      # would spend its whole webServer timeout watching it loop. Fail in one second instead.
      - name: the three variables are actually set
        run: |
          missing=
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::supabase status returned no value for:$missing — the local stack did not start, or the CLI renamed these keys" >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
          echo "anon key length: ${#NEXT_PUBLIC_SUPABASE_ANON_KEY}"

      # playwright.config.ts's webServer runs `npm run build && npm run start` inside a 180s budget,
      # and the `next build` job alone measured 1m21s cold. Building here first means the build's own
      # failures are reported as a build failure rather than as a webServer timeout, and leaves
      # .next/cache warm so the rebuild inside that budget is incremental.
      - name: build against the local stack
        run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: migrations · RLS policy tests
    runs-on: ubuntu-latest
    # PRs only, for the reason given on `e2e` above.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole schema is rebuilt from zero on every run: that reproducibility IS the acceptance
      # test for the migration set (08 §9). Only the services the policy tests need are started —
      # the db and auth (auth.users is the fixtures' root). Studio, realtime, storage and the edge
      # runtime would add minutes and prove nothing here.
      - name: start local supabase (db + auth only)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      # --no-seed: this job's acceptance test is the migrated schema itself (08 §9) plus the
      # policy tests below, which assert exact row counts (P7's near-duplicate guard expects
      # to be the only place in the table) — supabase/seed.sql's fixtures are local-dev-only
      # convenience data and must not be present here. `npm run db:reset` (no flag) is what
      # local dev runs, and does seed, per config.toml's [db.seed].
      - name: rebuild the schema from migration 0001
        run: npm run db:reset -- --no-seed
      # MS4's exit gate: user B's select of user A's saved_places returns zero rows, and a place is
      # invisible to a user who has not saved it. A policy regression fails the build, not the exam.
      - name: RLS policy tests (acceptance P3)
        run: npm run db:test
      # The same read-only inventory that gets pointed at staging and production. Running it here
      # too means its expected grant/policy matrix cannot drift away from the migrations unnoticed —
      # otherwise the check that guards production is itself unguarded.
      - name: schema inventory (read-only)
        run: npm run db:inventory
