name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · layer guard · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # MS2 exit criterion: the four-layer boundary is enforced, not aspirational.
      - run: npm run check:layers
      - run: npm run test

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and their ~40 system libraries.
    # `playwright install --with-deps` on a bare runner is dominated by apt-get and
    # its latency is wildly unstable — measured 2026-08-18 across four runs of this
    # repo: 24s, 203s, and one still going at 6min+. The image pull replaces it at a
    # steady 35-38s, so this is a smaller median and a far tighter spread.
    # `--user 1001` is Playwright's documented CI pattern — Chromium's sandbox
    # refuses to run as root.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The image tag above and the installed package must not drift apart:
      # a silently mismatched browser build is exactly the flake nobody can reproduce.
      - name: container image matches @playwright/test
        run: |
          image=1.62.1
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$image" != "$installed" ]; then
            echo "::error::container image is v$image but @playwright/test is $installed — bump the image tag in this workflow" >&2
            exit 1
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
